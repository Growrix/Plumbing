version: 1
folder: DOC/project-plan/shared-contracts/
purpose: >-
  Holds system-wide contracts, invariants, route registry, slug rules,
  config source-of-truth decisions, and the three-config collision resolution
  for the Plumbing Template. All other role folders must respect these contracts
  before making independent architectural decisions.
status: Active
last_updated: "2026-04-30"

owned_by: fullstack-contract-orchestrator
used_by:
  - frontend
  - api-and-data
  - backend
  - security
  - devops
  - qa

key_contracts:
  config_source_of_truth:
    site_config: "Brand, contact, nav, hero, trust bar, emergency banner, SEO defaults, footer"
    services_config: "Full service catalog — 8 items, slugs, categories, detail blocks"
    pages_config: "Per-page content only — about story, FAQ, emergency types, homepage section order. No nav, no brand strings."
    pricing_config: "Pricing tiers and plan comparison data"
    testimonials_config: "All testimonial items and aggregate stats"
    theme_config: "Design tokens only"
    booking_config: "Booking form field definitions and validation rules"
    legal_config: "Legal page sections with token placeholders (NEW)"
    careers_config: "Job openings list (NEW)"

  route_registry:
    - path: "/"                        status: built      file: "app/page.jsx"
    - path: "/contact"                 status: built      file: "app/contact/page.jsx"
    - path: "/emergency"               status: built      file: "app/emergency/page.jsx"
    - path: "/services"                status: missing    file: "app/services/page.jsx"
    - path: "/services/[slug]"         status: missing    file: "app/services/[slug]/page.jsx"
    - path: "/about"                   status: missing    file: "app/about/page.jsx"
    - path: "/reviews"                 status: missing    file: "app/reviews/page.jsx"
    - path: "/plans"                   status: missing    file: "app/plans/page.jsx"
    - path: "/booking"                 status: missing    file: "app/booking/page.jsx"
    - path: "/careers"                 status: missing    file: "app/careers/page.jsx"
    - path: "/privacy"                 status: missing    file: "app/privacy/page.jsx"
    - path: "/terms"                   status: missing    file: "app/terms/page.jsx"
    - path: "/license"                 status: missing    file: "app/license/page.jsx"
    - path: "/not-found (404)"         status: missing    file: "app/not-found.jsx"
    - path: "/sitemap.xml"             status: missing    file: "app/sitemap.ts"
    - path: "/robots.txt"              status: missing    file: "app/robots.ts"
    - path: "/api/booking"             status: missing    file: "app/api/booking/route.js"

  canonical_service_slugs:
    - emergency-plumbing
    - drain-cleaning
    - leak-repair
    - water-heater
    - pipe-services
    - sewer-services
    - bathroom-kitchen
    - inspection

  collision_resolution:
    winner_nav: "config/site.config.js nav.links — updated to use canonical service slugs above"
    winner_services: "config/services.config.js items — 8-item catalog is authoritative"
    loser: "config/pages.config.js navConfig and brand strings — must be stripped; reference siteConfig"
    action_required: "Remove siteConfig.services.items (old 6-item list); update nav hrefs to match servicesConfig slugs"
