kind = "web"
previewPath = "/"
title = "Australian Plumber Website"
version = "1.0.0"
id = "artifacts/plumber-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20647

[services.development]
run = "pnpm --filter @workspace/plumber-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/plumber-web", "run", "build" ]
publicDir = "artifacts/plumber-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20647"
BASE_PATH = "/"
